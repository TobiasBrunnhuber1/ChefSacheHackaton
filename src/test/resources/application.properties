# Isolierte In-Memory-Datenbank für automatisierte Tests (verändert keine Produktivdaten)
spring.datasource.url=jdbc:h2:mem:chefsachetest;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Testschema bei jedem Testlauf sauber neu erstellen und beim Beenden verwerfen
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

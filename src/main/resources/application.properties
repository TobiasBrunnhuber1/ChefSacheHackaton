# Anwendungsname für Spring Boot
spring.application.name=chefsache

# Auf allen Netzwerkschnittstellen lauschen, damit Mitarbeitende im lokalen WLAN zugreifen können
server.address=0.0.0.0

# Dateibasierte H2-Datenbank im lokalen Ordner ./data/chefsache (bleibt nach Neustart erhalten)
spring.datasource.url=jdbc:h2:file:./data/chefsache;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA-Schema automatisch anlegen bzw. aktualisieren und Open-Session-in-View deaktivieren
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2-Webkonsole für lokale Demo- und Prüfzwecke unter /h2-console aktivieren
spring.h2.console.enabled=true
